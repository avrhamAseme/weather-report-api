name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: node:18
    steps:
      - uses: actions/checkout@v4
      - run: npm run ci

  test:
    runs-on: ubuntu-latest
    container: node:18
    steps:
      - uses: actions/checkout@v4
      - run: npm test
